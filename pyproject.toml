[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ahl-api"
version = "0.3.0"
description = "Unofficial Python SDK for AHL brokerage accounts, PSX market data, and strategy research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "APIScorcher"}]
dependencies = ["requests>=2.32.4,<3"]
keywords = ["ahl", "psx", "sdk", "pakistan", "backtesting"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Office/Business :: Financial :: Investment"]

[project.optional-dependencies]
research = ["pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
ahl = "ahl_api.cli:main"

[project.urls]
Repository = "https://github.com/APIScorcher/ahl-api"
Issues = "https://github.com/APIScorcher/ahl-api/issues"
Documentation = "https://github.com/APIScorcher/ahl-api/tree/main/docs"

[tool.setuptools]
packages = ["ahl_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"ahl_api/__init__.py" = ["F401"]
